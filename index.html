<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Fonts are self-hosted from /fonts and declared in src/fonts.css, which is
      generated by scripts/fetch-fonts.mjs. They used to be linked from
      fonts.googleapis.com here AND imported again from src/index.css, so the
      browser fetched the same stylesheet twice from two different origins on
      every page view, and the first paint waited on a third party.

      Nothing on this site should reference a third-party origin. The product
      claims files never leave the device, and a request to Google on every page
      view is at minimum an IP address handed over — which the privacy page had
      to disclose, and which is a real GDPR exposure in the EU.
    -->
    <title>Furtu — fast, private tools for PDFs, images and data</title>
    <meta
      name="description"
      content="A private, browser-based toolbox: compress and merge PDFs, resize and convert images, format and validate data. Files are processed on your device, never uploaded."
    />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
